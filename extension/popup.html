<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TabScroller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1e1e2e; color: #cdd6f4; width: 220px; padding: 16px; }
    h2 { font-size: 15px; margin-bottom: 8px; }
    p { font-size: 12px; color: #6c7086; margin-bottom: 12px; }
    a { color: #89b4fa; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <h2>TabScroller</h2>
  <p>Hold right-click + scroll to switch tabs.</p>
  <a id="optionsLink">Open Settings</a>
  <script>
    document.getElementById('optionsLink').onclick = () => chrome.runtime.openOptionsPage();
  </script>
</body>
</html>
